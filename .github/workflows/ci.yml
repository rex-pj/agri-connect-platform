name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, tests incl. database)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Same image as production; ships postgis, unaccent and pg_trgm.
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CARGO_TERM_COLOR: always
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # --include-ignored runs the database tests against the service above.
      - run: cargo test --workspace -- --include-ignored

  islands:
    name: Islands bundle is up to date
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend/islands
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: backend/islands/package-lock.json
      - run: npm ci
      - run: npm run build
      # The bundle is committed so the Rust image needs no Node. A source
      # change without a rebuild ships stale behaviour; this fails instead.
      - run: git diff --exit-code -- ../crates/web/static/js/islands.js

  legacy:
    name: SvelteKit (check, build) — removed in S20
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: client-app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          PRIVATE_API_URL: http://web:8080

  images:
    name: Container images build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: docker/build-push-action@v6
        with:
          context: client-app
          push: false
          cache-from: type=gha,scope=legacy
          cache-to: type=gha,mode=max,scope=legacy

  deploy-scripts:
    name: Deploy scripts (shellcheck, compose config)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/remote-deploy.sh deploy/backup/agri-backup.sh deploy/db-init/01-app-role.sh
      # Placeholder values only to make compose interpolate; nothing is started.
      # The env file lives only on the VM; an empty one satisfies `config`.
      - run: sudo install -D -m 600 /dev/null /etc/agri-connect/web.env
      - run: docker compose -f deploy/compose.yaml config --quiet
        env:
          DOMAIN: example.vn
          WEB_IMAGE: web:ci
          LEGACY_IMAGE: legacy:ci
          POSTGRES_PASSWORD: ci
          APP_DB_PASSWORD: ci
