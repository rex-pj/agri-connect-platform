{#- A single search box that submits `q` by GET to `action`. -#}
{% import "atoms/icon.html" as atoms %}
{% macro search_bar(action, q, placeholder, label="Tìm kiếm") -%}
<form class="list-search" method="get" action="{{ action }}" role="search">
  <div class="list-search__row">
    <label class="list-search__input">
      {{ atoms::icon(name="fa-magnifying-glass", class="list-search__icon") }}
      <span class="visually-hidden">{{ label }}</span>
      <input type="search" name="q" value="{{ q }}" placeholder="{{ placeholder }}" enterkeyhint="search" required>
    </label>
    <button type="submit" class="list-search__submit" aria-label="{{ label }}">{{ atoms::icon(name="fa-arrow-right") }}</button>
  </div>
</form>
{%- endmacro search_bar %}
