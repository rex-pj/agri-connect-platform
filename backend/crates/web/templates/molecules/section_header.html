{#- Section title with an optional "see more" link. -#}
{% macro section_header(title, more_href="", more_label="Xem thêm") -%}
<div class="section-header mb-3">
  <h2 class="section-title">{{ title }}</h2>
  {% if more_href %}<a class="section-more" href="{{ more_href }}">{{ more_label }}</a>{% endif %}
</div>
{%- endmacro section_header %}
