[package]
name = "agri-connect-migration"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[[bin]]
name = "migration"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }

[dependencies.sea-orm-migration]
version = "1"
features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "with-chrono",
]
