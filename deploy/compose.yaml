# Production stack on the single Compute Engine VM. Started by
# remote-deploy.sh with --env-file compose.env (DOMAIN, image tags, database
# passwords, uploads bucket); the app's own secrets come from /etc/agri-connect/web.env.
name: agri-connect

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates: losing this re-requests them (rate-limited by Let's Encrypt)
      - caddy_config:/config
    depends_on:
      - web

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    env_file:
      - /etc/agri-connect/web.env
    environment:
      BIND_ADDR: 0.0.0.0:8080
      # Rows only; the schema belongs to agri_owner, used just to migrate.
      DATABASE_URL: postgres://agri_app:${APP_DB_PASSWORD}@db:5432/agri_connect
      MIGRATION_DATABASE_URL: postgres://agri_owner:${OWNER_DB_PASSWORD}@db:5432/agri_connect
      APP_ENV: prod
      APP_URL: https://${DOMAIN}
      # Product images. The VM service account reaches it through the metadata
      # server; no key file.
      GCS_BUCKET: ${GCS_BUCKET}
      HTTPS_ENABLED: "true"
      # Caddy is the one proxy in front; it appends the client address.
      TRUSTED_PROXY_HOPS: "1"
      LOG_FORMAT: json
      RUST_LOG: info,sea_orm=warn,sqlx=warn
    depends_on:
      db:
        condition: service_healthy
    # Long enough for in-flight requests to drain after SIGTERM.
    stop_grace_period: 30s

  db:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: agri_connect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      # On the separate persistent disk, so the data outlives the VM.
      - /mnt/disks/pgdata/postgres:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agri_connect"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb
    # Sized for the e2-small VM (2 GB, shared with the app); each can be set in
    # compose.env for a larger one. The image's defaults (128 MB of buffers,
    # spinning-disk page costs) make every large table a disk read.
    # pg_stat_statements records what each statement costs: what an index or
    # a cache is decided on (see "Slow queries" in deploy/README.md).
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - random_page_cost=1.1
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
    # No ports: reachable only on the compose network.

volumes:
  caddy_data:
  caddy_config:
